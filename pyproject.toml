[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-tracking-uncertainty"
version = "1.0.0"
description = "Reproducible feasibility audit for uncertainty-aware glioblastoma cell tracking"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
keywords = ["cell-tracking", "uncertainty", "reproducibility", "glioblastoma", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=10,<13",
  "certifi>=2024.2.2,<2027",
]

[project.urls]
Repository = "https://github.com/mohamad679/gbm-tracking-uncertainty"
Documentation = "https://github.com/mohamad679/gbm-tracking-uncertainty/tree/main/docs"
Issues = "https://github.com/mohamad679/gbm-tracking-uncertainty/issues"

[project.scripts]
gbm-audit = "gbm_audit.cli:main"
gbm-benchmark = "gbm_audit.benchmark:main"
gbm-corrupt = "gbm_audit.corruptions:main"
gbm-baseline = "gbm_audit.baseline:main"
gbm-uncertainty = "gbm_audit.uncertainty:main"
gbm-dynamics = "gbm_audit.dynamics:main"
gbm-gate-sensitivity = "gbm_audit.gate_sensitivity:main"
gbm-candidate-benchmark = "gbm_audit.candidate_benchmark:main"
gbm-adaptive-tuning = "gbm_audit.adaptive_tuning:main"
gbm-adaptive-tuning-v2 = "gbm_audit.adaptive_tuning_v2:main"
gbm-adaptive-tuning-v3 = "gbm_audit.adaptive_tuning_v3:main"
gbm-stage-a-locked = "gbm_audit.locked_evaluation:main"
gbm-stage-b-development = "gbm_audit.context_evaluation:main"
gbm-stage-b-locked = "gbm_audit.context_locked_evaluation:main"
gbm-stage-c-development = "gbm_audit.stage_c_dynamics:main"
gbm-stage-c-locked = "gbm_audit.stage_c_locked_evaluation:main"
gbm-stage-c-v2-audit-t98g = "gbm_audit.t98g_audit:main"
gbm-stage-c-v2-development = "gbm_audit.stage_c_v2_development:main"
gbm-stage-c-v2-evaluate-t98g = "gbm_audit.stage_c_v2_t98g_evaluation:main"
gbm-stage-d-development = "gbm_audit.stage_d_development:main"
gbm-stage-d-decision = "gbm_audit.stage_d_decision:main"
gbm-stage-d-v2-audit-huh7 = "gbm_audit.stage_d_huh7_audit:main"
gbm-stage-d-v2-evaluate-huh7 = "gbm_audit.stage_d_huh7_evaluation:main"
gbm-stage-d-v3-development = "gbm_audit.stage_d_v3_development:main"
gbm-stage-d-v3-evaluate = "gbm_audit.stage_d_v3_evaluation:main"
gbm-stage-e-development = "gbm_audit.stage_e_development:main"
gbm-stage-e-evaluate = "gbm_audit.stage_e_evaluation:main"
gbm-soft-dynamics = "gbm_audit.soft_dynamics:main"
gbm-final-audit = "gbm_audit.final_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gbm_audit = ["*.html"]
