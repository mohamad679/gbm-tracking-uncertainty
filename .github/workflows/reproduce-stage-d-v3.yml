name: reproduce-stage-d-v3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/reproduce-stage-d-v3.yml"
      - "docs/stage-d-v2-**"
      - "docs/stage-d-v3-**"
      - "docs/stage-c-v2-development-fit.json"
      - "docs/stage-d-development-fit.json"
      - "src/gbm_audit/**"
      - "tests/**"
      - "pyproject.toml"
      - "constraints.txt"

permissions:
  contents: read

jobs:
  locked-huh7-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned environment
        run: python -m pip install -c constraints.txt -e .
      - name: Run repository tests
        run: python -m unittest discover -s tests -q
      - name: Download official CTC archives
        run: |
          mkdir -p data/raw results
          curl --fail --location --retry 3 --retry-delay 2 \
            https://data.celltrackingchallenge.net/training-datasets/PhC-C2DH-U373.zip \
            --output data/raw/PhC-C2DH-U373.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            https://data.celltrackingchallenge.net/training-datasets/Fluo-C2DL-Huh7.zip \
            --output data/raw/Fluo-C2DL-Huh7.zip
      - name: Build frozen U373 input
        run: |
          python -m gbm_audit.benchmark data/raw/PhC-C2DH-U373.zip \
            --output results/u373-reference-manifest.json
      - name: Reproduce Huh7 data-only audit
        run: |
          python -m gbm_audit.stage_d_huh7_audit \
            data/raw/Fluo-C2DL-Huh7.zip \
            --output /tmp/stage-d-v2-huh7-locked-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("docs/stage-d-v2-huh7-locked-audit.json").read_text())
          actual = json.loads(Path("/tmp/stage-d-v2-huh7-locked-audit.json").read_text())
          if expected != actual:
              raise SystemExit("Huh7 data-only audit differs from frozen artifact")
          PY
      - name: Reproduce Stage D v2 zero-shot result
        run: |
          python -m gbm_audit.stage_d_huh7_evaluation \
            docs/stage-d-v2-protocol.json \
            docs/stage-d-v2-huh7-locked-audit.json \
            results/u373-reference-manifest.json \
            docs/stage-c-v2-development-fit.json \
            docs/stage-d-development-fit.json \
            data/raw/Fluo-C2DL-Huh7.zip \
            --output /tmp/stage-d-v2-huh7-evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("docs/stage-d-v2-huh7-locked-evaluation.json").read_text())
          actual = json.loads(Path("/tmp/stage-d-v2-huh7-evaluation.json").read_text())
          if expected != actual:
              raise SystemExit("Stage D v2 Huh7 result differs from frozen artifact")
          PY
      - name: Reproduce Stage D v3 calibration
        run: |
          python -m gbm_audit.stage_d_v3_development \
            docs/stage-d-v3-protocol.json \
            docs/stage-d-v2-huh7-locked-audit.json \
            docs/stage-d-v2-huh7-locked-evaluation.json \
            results/u373-reference-manifest.json \
            docs/stage-c-v2-development-fit.json \
            docs/stage-d-development-fit.json \
            data/raw/Fluo-C2DL-Huh7.zip \
            --output /tmp/stage-d-v3-development-fit.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("docs/stage-d-v3-development-fit.json").read_text())
          actual = json.loads(Path("/tmp/stage-d-v3-development-fit.json").read_text())
          if expected != actual:
              raise SystemExit("Stage D v3 calibration differs from frozen artifact")
          PY
      - name: Reproduce locked Stage D v3 result
        run: |
          python -m gbm_audit.stage_d_v3_evaluation \
            docs/stage-d-v3-protocol.json \
            docs/stage-d-v2-huh7-locked-audit.json \
            docs/stage-d-v2-huh7-locked-evaluation.json \
            docs/stage-d-v3-development-fit.json \
            docs/stage-d-v3-huh7-sequence02-lock.json \
            results/u373-reference-manifest.json \
            docs/stage-c-v2-development-fit.json \
            docs/stage-d-development-fit.json \
            data/raw/Fluo-C2DL-Huh7.zip \
            --output /tmp/stage-d-v3-huh7-sequence02-evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("docs/stage-d-v3-huh7-sequence02-evaluation.json").read_text())
          actual = json.loads(Path("/tmp/stage-d-v3-huh7-sequence02-evaluation.json").read_text())
          if expected != actual:
              raise SystemExit("Stage D v3 locked result differs from frozen artifact")
          print("Stage D v3 locked Huh7 GO reproduces exactly.")
          PY
