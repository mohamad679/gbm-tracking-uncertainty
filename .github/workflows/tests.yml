name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test environment
        run: python -m pip install -c constraints.txt -e . coverage
      - name: Run tests with coverage
        run: |
          coverage run --source=gbm_audit -m unittest discover -s tests -q
          coverage report --show-missing --fail-under=68
          coverage report --include="src/gbm_audit/uncertainty.py,src/gbm_audit/context_posterior.py,src/gbm_audit/corruptions.py,src/gbm_audit/dynamics.py,src/gbm_audit/stage_c_dynamics.py,src/gbm_audit/stage_c_v2_sampler.py,src/gbm_audit/stage_d_operators.py,src/gbm_audit/stage_e_metrics.py" --fail-under=83

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel and verify version
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python - <<'PY'
          import tomllib
          import gbm_audit

          with open("pyproject.toml", "rb") as stream:
              expected = tomllib.load(stream)["project"]["version"]
          assert gbm_audit.__version__ == expected
          print(gbm_audit.__version__)
          PY
