name: validate-stage-e-locked-evaluator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/validate-stage-e-locked-evaluator.yml"
      - "docs/stage-e-**"
      - "src/gbm_audit/stage_e_*.py"
      - "tests/test_stage_e_*.py"
      - "pyproject.toml"
      - "constraints.txt"

permissions:
  contents: read

jobs:
  verify-pre-outcome-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned environment
        run: python -m pip install -c constraints.txt -e .
      - name: Validate evaluator and lock without sequence-02 data
        run: |
          python -m unittest \
            tests.test_stage_e_data \
            tests.test_stage_e_metrics \
            tests.test_stage_e_evaluation \
            tests.test_stage_e_protocol -v
