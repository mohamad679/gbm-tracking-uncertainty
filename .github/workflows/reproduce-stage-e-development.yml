name: reproduce-stage-e-development

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/reproduce-stage-e-development.yml"
      - "docs/evidence/stage-e/stage-e-**"
      - "src/gbm_audit/**"
      - "tests/**"
      - "pyproject.toml"
      - "constraints.txt"

permissions:
  contents: read

jobs:
  reproduce-development-only-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned environment
        run: python -m pip install -c constraints.txt -e .
      - name: Run repository tests
        run: python -m unittest discover -s tests -q
      - name: Download registered official CTC archives
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 --retry-delay 2 \
            https://data.celltrackingchallenge.net/training-datasets/Fluo-N2DH-GOWT1.zip \
            --output data/raw/Fluo-N2DH-GOWT1.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            https://data.celltrackingchallenge.net/training-datasets/DIC-C2DH-HeLa.zip \
            --output data/raw/DIC-C2DH-HeLa.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            https://data.celltrackingchallenge.net/training-datasets/Fluo-N2DH-SIM+.zip \
            --output data/raw/Fluo-N2DH-SIM+.zip
      - name: Reproduce development-only fit
        run: |
          python -m gbm_audit.stage_e_development \
            --gowt1 data/raw/Fluo-N2DH-GOWT1.zip \
            --hela data/raw/DIC-C2DH-HeLa.zip \
            --sim data/raw/Fluo-N2DH-SIM+.zip \
            --output /tmp/stage-e-development-fit.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("docs/evidence/stage-e/stage-e-development-fit.json").read_text())
          actual = json.loads(Path("/tmp/stage-e-development-fit.json").read_text())
          if expected != actual:
              raise SystemExit("Stage E development-only fit differs from frozen artifact")
          boundary = actual["registered_access_boundary"]
          if boundary["decoded_sequences"] != ["01"] or any(
              boundary[key]
              for key in (
                  "locked_test_coordinates_extracted",
                  "locked_test_metrics_computed",
                  "locked_test_outcomes_evaluated",
              )
          ):
              raise SystemExit("Locked sequence-02 access boundary was violated")
          print("Stage E sequence-01 development fit reproduces exactly; sequence 02 remains locked.")
          PY
