name: validate-dryad-confirmatory-pipeline

on:
  pull_request:
    paths:
      - "src/gbm_audit/dryad_local.py"
      - "src/gbm_audit/dryad_confirmatory.py"
      - "tests/test_dryad_local.py"
      - "tests/test_dryad_confirmatory.py"
      - "docs/dryad-confirmatory-**"
      - "pyproject.toml"
      - ".github/workflows/validate-dryad-confirmatory-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -c constraints.txt -e .
      - name: Run Dryad local and confirmatory tests
        run: python -m unittest tests.test_dryad_local tests.test_dryad_confirmatory -v
      - name: Verify confirmatory schema remains pre-outcome pending
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('docs/dryad-confirmatory-schema-lock.json').read_text())
          if lock.get('status') != 'PENDING_LOCAL_SCHEMA_INSPECTION':
              raise SystemExit('Schema lock must remain pending until the real local schema inventory is reviewed.')
          print('Pre-outcome boundary preserved.')
          PY
