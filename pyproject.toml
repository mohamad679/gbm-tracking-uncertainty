[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-tracking-uncertainty"
version = "0.0.1"
description = "Read-only feasibility audit for uncertainty-aware glioblastoma cell tracking"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "Pillow>=10", "certifi>=2024.2.2"]

[project.scripts]
gbm-audit = "gbm_audit.cli:main"
gbm-benchmark = "gbm_audit.benchmark:main"
gbm-corrupt = "gbm_audit.corruptions:main"
gbm-baseline = "gbm_audit.baseline:main"
gbm-uncertainty = "gbm_audit.uncertainty:main"
gbm-dynamics = "gbm_audit.dynamics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gbm_audit = ["*.html"]
