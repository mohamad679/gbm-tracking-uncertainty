name: Bug report
description: Report a reproducible software or pipeline defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, inputs, and the smallest reproducible case.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "0.2.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - "Other / unknown"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Scientific/output impact
      description: State whether numerical artifacts, gates, or reproducibility appear affected.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I understand this repository is a technical research audit and not a clinical system.
          required: true
