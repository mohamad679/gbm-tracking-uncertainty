name: reproduce-stage-e-track-bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/reproduce-stage-e-track-bootstrap.yml"
      - "docs/evidence/stage-e/**"
      - "src/gbm_audit/stage_e_track_bootstrap.py"
      - "src/gbm_audit/stage_e_evaluation.py"
      - "src/gbm_audit/stage_e_data.py"
      - "src/gbm_audit/uncertainty.py"
      - "tests/test_stage_e_track_bootstrap.py"
      - "pyproject.toml"
      - "constraints.txt"

permissions:
  contents: read

jobs:
  track-cluster-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned project environment
        run: python -m pip install -c constraints.txt -e .
      - name: Run track-bootstrap unit tests
        run: python -m unittest tests.test_stage_e_track_bootstrap -v
      - name: Download registered official CTC archives
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 --retry-delay 2 \
            https://data.celltrackingchallenge.net/training-datasets/Fluo-N2DH-GOWT1.zip \
            --output data/raw/Fluo-N2DH-GOWT1.zip
          curl --fail --location --retry 3 --retry-delay 2 \
            https://data.celltrackingchallenge.net/training-datasets/DIC-C2DH-HeLa.zip \
            --output data/raw/DIC-C2DH-HeLa.zip
      - name: Reconstruct clean links and compute true-track cluster intervals
        run: |
          python -m gbm_audit.stage_e_track_bootstrap \
            --gowt1 data/raw/Fluo-N2DH-GOWT1.zip \
            --hela data/raw/DIC-C2DH-HeLa.zip \
            --iterations 1000 \
            --seed 20260923 \
            --output /tmp/stage-e-track-bootstrap.json
          cat /tmp/stage-e-track-bootstrap.json
      - name: Upload machine-readable track-cluster intervals
        uses: actions/upload-artifact@v4
        with:
          name: stage-e-track-bootstrap
          path: /tmp/stage-e-track-bootstrap.json
          if-no-files-found: error
