name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned validation environment
        run: python -m pip install -c constraints.txt -e . coverage

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import gbm_audit; print(gbm_audit.__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Run tests and coverage gate
        run: |
          coverage run --source=gbm_audit -m unittest discover -s tests -q
          coverage report --show-missing --fail-under=65

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify wheel install
        shell: bash
        run: |
          python -m venv /tmp/gbm-release-smoke
          /tmp/gbm-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/gbm-release-smoke/bin/python -c 'import gbm_audit; print(gbm_audit.__version__)'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
